<svg class="diagram" viewBox="0 0 520 270" width="100%" role="img" aria-label="Floating roof 懸浮式車頂示意圖：小型掀背車側面線稿，車頂與車身異色、立柱塗黑，車頂像浮在車窗上方">
  <text x="260" y="22" fill="currentColor" font-size="15" text-anchor="middle" opacity=".75">側面（小型掀背車）</text>
  <!-- body -->
  <path d="M48,192 L52,160 L78,140 L150,128 L410,124 L452,136 L470,160 L472,192 Z" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- wheel arches cut -->
  <circle cx="132" cy="196" r="36" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="132" cy="196" r="21" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
  <circle cx="392" cy="196" r="36" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="392" cy="196" r="21" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
  <!-- headlight / taillight -->
  <path d="M56,152 L84,146 L80,156 L56,160 Z" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".8"/>
  <path d="M452,138 L468,152 L466,160 L450,150 Z" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".8"/>
  <!-- door cut & handle -->
  <line x1="268" y1="128" x2="270" y2="186" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
  <line x1="300" y1="140" x2="322" y2="140" stroke="currentColor" stroke-width="2" opacity=".6"/>
  <!-- glasshouse (dark band incl. blacked pillars) -->
  <path d="M158,126 L214,84 L396,80 L432,124 Z" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- windows lighter inside dark band -->
  <path d="M176,122 L220,90 L262,89 L262,122 Z" fill="currentColor" fill-opacity=".18"/>
  <path d="M276,122 L276,88 L352,86 L352,122 Z" fill="currentColor" fill-opacity=".18"/>
  <path d="M364,122 L364,86 L392,86 L418,122 Z" fill="currentColor" fill-opacity=".18"/>
  <!-- ROOF highlight (contrast colour, floating) -->
  <path d="M206,82 Q300,62 402,76 L398,82 Q300,70 212,88 Z" fill="#f08a5d" stroke="#f08a5d" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- pillar markers -->
  <path d="M262,90 L262,122 L276,122 L276,88 Z" fill="none" stroke="#f08a5d" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M352,86 L352,122 L364,122 L364,86 Z" fill="none" stroke="#f08a5d" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- labels -->
  <line x1="300" y1="66" x2="300" y2="44" stroke="#f08a5d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="300" y="40" fill="#f08a5d" font-size="16" text-anchor="middle">① 車頂漆成對比色（黑）</text>
  <line x1="269" y1="122" x2="200" y2="236" stroke="#f08a5d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="358" y1="122" x2="430" y2="236" stroke="#f08a5d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="200" y="252" fill="currentColor" font-size="15" text-anchor="middle">② B 柱塗黑</text>
  <text x="430" y="252" fill="currentColor" font-size="15" text-anchor="middle">③ C 柱塗黑／藏進玻璃</text>
  <text x="260" y="268" fill="currentColor" font-size="12" text-anchor="middle" opacity=".7">立柱和車窗連成一條深色帶，車頂看起來像浮在車身上</text>
</svg>
