<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" role="img" aria-label="B-pillar B 柱示意圖：左為一般車側面 A、B、C 柱，B 柱加粗強調；右為無 B 柱對開門的大開口" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif">
  <text x="20" y="26" font-size="16" fill="currentColor" stroke="none">一般車：A、B、C 柱撐起車頂</text>
  <path d="M30 120 L60 120 L105 70 L215 64 L250 120 L250 120 L235 120" />
  <path d="M20 150 Q22 122 60 120 L250 120 Q262 122 262 150 L262 160 L20 160 Z" />
  <circle cx="70" cy="162" r="18" /><circle cx="212" cy="162" r="18" />
