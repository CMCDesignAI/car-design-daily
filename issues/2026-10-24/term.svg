<svg class="diagram" viewBox="0 0 520 330" width="100%" role="img" aria-label="對開式車門示意：長軸距行政轎車側面線稿，前門鉸鏈在前，強調色標出鉸鏈在後、向後打開的後門" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif">
