    <text x="300" y="232">虛線：另外架高的尾翼（不是鴨尾）</text>
    <text x="30" y="40">車頂到車尾是一條連續弧線</text>
  </g>
  <path d="M462 68 L474 122" stroke-dasharray="4 4" stroke-width="1.4"/>
  <path d="M430 216 L444 112" stroke-dasharray="4 4" stroke-width="1.4"/>
