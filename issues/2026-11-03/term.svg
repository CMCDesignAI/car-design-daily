<svg class="diagram" viewBox="0 0 520 260" width="100%" role="img" aria-label="鴨尾示意：流線型轎車側面，行李廂蓋末端一體往上翹起" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, sans-serif">
  <!-- fastback sedan side view -->
  <path d="M30 178 L30 160 Q34 146 60 140 L130 128 Q190 82 250 74 Q320 70 370 96 Q410 118 448 132"/>
  <path d="M30 178 L76 178 M164 178 L346 178 M434 178 L478 178 L480 150"/>
  <circle cx="120" cy="178" r="30"/><circle cx="120" cy="178" r="13"/>
  <circle cx="390" cy="178" r="30"/><circle cx="390" cy="178" r="13"/>
  <path d="M150 126 Q196 92 246 86 L250 124 Z"/>
  <path d="M262 86 Q320 84 360 112 L262 124 Z"/>
  <!-- ducktail: integrated upturned end of deck -->
  <path d="M448 132 Q470 136 482 126 L480 150" stroke="#f08a5d" stroke-width="3.4"/>
