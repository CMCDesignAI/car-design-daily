<svg class="diagram" viewBox="0 0 520 260" width="100%" role="img" aria-label="掀背式尾門示意：斜背轎車側面，後擋風玻璃連同行李廂蓋從車頂鉸鏈整片往上掀開" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, sans-serif">
