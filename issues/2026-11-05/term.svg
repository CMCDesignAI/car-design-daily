<svg class="diagram" viewBox="0 0 520 270" width="100%" role="img" aria-label="軸距示意：轎車側面線稿，標出前輪中心到後輪中心的距離，以及加長版多出的後座長度" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- body side profile (sedan) -->
  <path d="M40 170 L44 146 Q48 134 64 130 L132 120 Q150 104 186 90 L236 76 Q262 70 300 70 L344 72 Q372 76 396 96 L424 118 L470 126 Q488 130 490 146 L492 170"/>
  <path d="M40 170 L84 170 M160 170 L370 170 M446 170 L492 170"/>
  <!-- wheel arches & wheels -->
  <path d="M84 170 A38 38 0 0 1 160 170"/>
  <path d="M370 170 A38 38 0 0 1 446 170"/>
  <circle cx="122" cy="172" r="31"/><circle cx="122" cy="172" r="14"/>
  <circle cx="408" cy="172" r="31"/><circle cx="408" cy="172" r="14"/>
  <!-- greenhouse / windows -->
  <path d="M168 118 L198 96 Q222 86 250 84 L262 84 L262 118 Z"/>
  <path d="M272 84 L332 84 Q356 86 376 104 L386 118 L272 118 Z" stroke="#f08a5d"/>
  <!-- doors -->
  <path d="M262 84 L262 166 M384 120 L380 166" stroke-width="1.6"/>
  <path d="M272 122 L272 166" stroke="#f08a5d" stroke-width="1.6"/>
  <!-- headlight / taillight -->
  <path d="M46 142 L74 136 L72 146 L48 150 Z"/>
  <path d="M474 132 L488 136 L488 146 L476 144 Z"/>
  <!-- wheelbase dimension -->
  <path d="M122 205 L122 228 M408 205 L408 228" stroke="#f08a5d" stroke-width="1.6"/>
  <path d="M126 220 L404 220" stroke="#f08a5d" stroke-width="2.4"/>
  <path d="M126 220 L136 215 M126 220 L136 225 M404 220 L394 215 M404 220 L394 225" stroke="#f08a5d" stroke-width="2.4"/>
  <!-- stretched zone -->
  <rect x="264" y="122" width="10" height="44" fill="#f08a5d" fill-opacity=".35" stroke="#f08a5d" stroke-width="1.4" stroke-dasharray="3 3"/>
  <g fill="currentColor" stroke="none" font-family="sans-serif" font-size="15">
    <text x="265" y="245" text-anchor="middle" fill="#f08a5d">① 軸距：前輪中心 → 後輪中心</text>
    <text x="300" y="36">② 長軸版多出的長度</text>
    <text x="300" y="54">　 放在後門與後座</text>
    <text x="16" y="264" font-size="12" opacity=".8">例：中國版 BMW 3 系列軸距 2,970mm，比歐美版長約 100mm</text>
  </g>
  <path d="M296 58 L272 118" stroke="#f08a5d" stroke-width="1.4" stroke-dasharray="4 4"/>
</svg>
