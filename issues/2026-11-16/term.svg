    <!-- headlights -->
    <path d="M108 170 L196 178 L190 190 L104 184 Z"/>
    <path d="M412 170 L324 178 L330 190 L416 184 Z"/>
    <!-- lower intakes -->
    <path d="M104 238 L150 246 L146 270 L102 266 Z" stroke-width="1.6"/>
    <path d="M416 238 L370 246 L374 270 L418 266 Z" stroke-width="1.6"/>
    <!-- wheels -->
    <rect x="96" y="290" width="54" height="40" rx="8"/>
    <rect x="370" y="290" width="54" height="40" rx="8"/>
    <!-- ground -->
    <path d="M60 332 L460 332" stroke-width="1.4" stroke-dasharray="4 5"/>
  </g>
  <!-- spindle body (accent) -->
  <path d="M204 162 Q260 156 316 162 L292 214 L330 276 Q260 284 190 276 L228 214 Z" fill="#f08a5d" fill-opacity="0.18" stroke="#f08a5d" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="260" cy="186" r="7" fill="none" stroke="#f08a5d" stroke-width="2.4"/>
  <!-- labels -->
  <g font-family="sans-serif" fill="currentColor">
    <g stroke="#f08a5d" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
      <path d="M210 164 L176 104 L40 104"/>
      <path d="M228 214 L40 214"/>
      <path d="M300 272 L340 352 L380 352"/>
    </g>
    <text x="40" y="96" font-size="15">① 上緣接引擎蓋前緣</text>
    <text x="40" y="206" font-size="15">② 中間收腰</text>
    <text x="300" y="372" font-size="15">③ 下方張開成保桿</text>
    <text x="300" y="46" font-size="13" opacity="0.8">Lexus 標誌在收腰上方</text>
    <path d="M300 50 L264 178" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4" fill="none" opacity="0.7"/>
  </g>
</svg>
