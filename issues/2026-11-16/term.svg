<svg class="diagram" viewBox="0 0 520 380" width="100%" role="img" aria-label="紡錘形車身示意：純電休旅正面，上寬、收腰、下方張開的紡錘輪廓由引擎蓋前緣與保桿圍成" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
