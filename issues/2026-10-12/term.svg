<svg class="diagram" viewBox="0 0 520 250" width="100%" role="img" aria-label="Coda tronca 截尾造型示意圖：Cuorerosso 側面線稿，楔形腰線收到齊削車尾，雙圓尾燈以強調色標出">
<text x="260" y="22" fill="currentColor" font-size="16" text-anchor="middle" opacity=".8">側面（Cuorerosso 示意）</text>
<!-- wheels -->
<ellipse cx="130" cy="175" rx="34" ry="34" fill="none" stroke="currentColor" stroke-width="2.5"/>
<ellipse cx="130" cy="175" rx="18" ry="18" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".7"/>
<ellipse cx="390" cy="175" rx="36" ry="36" fill="none" stroke="currentColor" stroke-width="2.5"/>
<ellipse cx="390" cy="175" rx="19" ry="19" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".7"/>
<!-- ground -->
<line x1="40" y1="210" x2="480" y2="210" stroke="currentColor" stroke-width="1.2" opacity=".35"/>
<!-- body side silhouette: low nose, long hood, greenhouse, truncated rear -->
<path d="M70,170 L85,145 L120,120 L200,105 L300,100 L360,105 L420,125 L455,125 L455,170 L430,175 L70,175 Z"
      fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
<!-- lower sill -->
<path d="M70,175 L430,175" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>
<!-- hood / belt -->
<path d="M95,145 L200,118 L300,112 L360,118 L420,138" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".7"/>
<!-- greenhouse / windows -->
<path d="M200,105 L220,78 L310,74 L350,100 L300,100 L210,108 Z"
      fill="currentColor" fill-opacity=".10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M225,100 L225,82" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
<path d="M280,98 L280,78" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
<!-- front lamp hint -->
<rect x="78" y="138" width="22" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".7"/>
<!-- scudetto hint on nose -->
<path d="M72,152 L82,145 L90,152 L82,160 Z" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/>
<!-- wedge character line to truncated rear -->
<path d="M110,150 L250,128 L360,132 L455,145" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55" stroke-dasharray="4 3"/>
<!-- Coda tronca: vertical truncated rear face highlighted -->
<line x1="455" y1="125" x2="455" y2="170" stroke="#f08a5d" stroke-width="4" stroke-linecap="round"/>
<!-- twin circular rear lamps on truncated face -->
<circle cx="455" cy="138" r="7" fill="none" stroke="#f08a5d" stroke-width="2.5"/>
<circle cx="455" cy="158" r="7" fill="none" stroke="#f08a5d" stroke-width="2.5"/>
<!-- small highlight fill on truncated section -->
<path d="M430,125 L455,125 L455,170 L430,170 Z" fill="#f08a5d" fill-opacity=".12"/>
<!-- labels -->
<line x1="455" y1="125" x2="490" y2="70" stroke="#f08a5d" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="498" y="66" fill="#f08a5d" font-size="15" text-anchor="end">① 齊削車尾截面</text>
<line x1="455" y1="148" x2="490" y2="100" stroke="#f08a5d" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="498" y="96" fill="#f08a5d" font-size="15" text-anchor="end">② 雙圓尾燈嵌截面</text>
<line x1="300" y1="128" x2="300" y2="55" stroke="#f08a5d" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="300" y="48" fill="#f08a5d" font-size="15" text-anchor="middle">③ 楔形線收到尾</text>
<text x="260" y="238" fill="currentColor" font-size="15" text-anchor="middle" opacity=".8">車尾像被刀切齊，減少亂流，也變成 Alfa 的辨識</text>
</svg>
