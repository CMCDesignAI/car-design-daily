<svg class="diagram" viewBox="0 0 520 250" width="100%" role="img" aria-label="Flyline 飛線示意圖：中置超跑側面線稿，從擋風到車尾的車頂輪廓以強調色標出">
  <text x="260" y="22" fill="currentColor" font-size="15" text-anchor="middle" opacity=".75">側面（中置超跑）</text>

  <!-- wheels -->
  <circle cx="120" cy="188" r="38" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="120" cy="188" r="22" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
  <circle cx="400" cy="188" r="40" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="400" cy="188" r="24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>

  <!-- lower body sill -->
  <path d="M55,175 L85,162 L155,158 L200,155 L320,155 L380,158 L455,168 L470,178 L468,190 L55,190 Z"
        fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>

  <!-- greenhouse / side windows -->
  <path d="M155,118 L210,78 L310,78 L355,118 L340,150 L170,150 Z"
        fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="250" y1="78" x2="250" y2="150" stroke="currentColor" stroke-width="1.2" opacity=".35"/>

  <!-- nose / hood -->
  <path d="M55,175 L70,130 L110,112 L155,118" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- headlight hint -->
  <ellipse cx="88" cy="140" rx="14" ry="8" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7"/>

  <!-- rear deck / wing -->
  <path d="M355,118 L400,112 L455,130 L470,168" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M370,100 L430,95 L435,108 L375,112 Z" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7"/>

  <!-- FLYLINE highlight: windshield top → roof → rear drop -->
  <path d="M155,118 L210,78 L310,78 L355,118 L400,112"
        fill="none" stroke="#f08a5d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- callout lines -->
  <line x1="210" y1="78" x2="210" y2="48" stroke="#f08a5d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="210" y="42" fill="#f08a5d" font-size="15" text-anchor="middle">① 擋風上緣起點</text>

  <line x1="260" y1="78" x2="260" y2="55" stroke="#f08a5d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="320" y="52" fill="#f08a5d" font-size="15" text-anchor="start">② 車頂飛線</text>

  <line x1="370" y1="115" x2="420" y2="145" stroke="#f08a5d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="425" y="158" fill="#f08a5d" font-size="15" text-anchor="start">③ 往車尾落下</text>

  <text x="260" y="228" fill="currentColor" font-size="14" text-anchor="middle" opacity=".8">從擋風到車尾的一條輪廓＝Flyline（本期 Mission S）</text>
</svg>
