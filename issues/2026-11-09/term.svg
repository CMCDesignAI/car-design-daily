<path d="M66 160 L92 156"/><path d="M462 156 L476 160"/></g>
<path d="M196 96 Q206 88 222 88 L360 88 Q378 88 390 100 L428 140 L404 140 L380 110 Q372 100 362 100 L310 100 L310 140 L300 140 L300 100 L230 100 L206 140 L150 140 Z" fill="#f08a5d" fill-opacity="0.55" stroke="#f08a5d" stroke-width="2.2"/>
