<svg class="diagram" viewBox="0 0 520 260" width="100%" role="img" aria-label="手動捲收帆布頂示意：小車側面，車頂中段帆布往後捲起，車頂側梁與窗框保留" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, sans-serif">
  <!-- body: small round 2CV-like car, side view -->
  <path d="M40 182 L40 160 Q42 140 70 132 L120 124 Q140 88 175 70 Q230 52 300 56 Q365 60 400 98 Q430 128 470 140 Q486 146 486 164 L486 182"/>
  <path d="M40 182 L80 182 M160 182 L360 182 M440 182 L486 182"/>
  <circle cx="120" cy="182" r="32"/><circle cx="120" cy="182" r="14"/>
  <circle cx="400" cy="182" r="32"/><circle cx="400" cy="182" r="14"/>
  <!-- windows / pillars -->
  <path d="M150 122 Q168 92 196 80 L250 76 L250 122 Z"/>
  <path d="M262 76 L318 78 Q350 82 372 118 L262 122 Z"/>
  <!-- roof side rails remain -->
  <path d="M180 74 Q240 62 300 64 Q345 66 372 88" stroke-width="3"/>
  <!-- open area (canvas rolled back) -->
  <path d="M196 68 Q240 60 290 62" stroke="#f08a5d" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- rolled canvas bundle -->
  <ellipse cx="318" cy="62" rx="22" ry="11" fill="#f08a5d" fill-opacity="0.25" stroke="#f08a5d" stroke-width="2.6"/>
  <path d="M302 60 Q318 52 334 60 M304 66 Q318 72 332 66" stroke="#f08a5d" stroke-width="1.6"/>
  <!-- arrow showing roll direction -->
  <path d="M220 40 L290 40 M282 34 L292 40 L282 46" stroke="#f08a5d"/>
  <!-- labels -->
  <g font-size="15" fill="currentColor" stroke="none">
    <text x="150" y="30">往後捲起（手動）</text>
    <text x="350" y="40">捲起的帆布</text>
    <text x="20" y="235">車頂側梁與窗框保留，不是真正的敞篷車</text>
  </g>
  <path d="M348 44 L336 54" stroke-dasharray="4 4" stroke-width="1.4"/>
  <path d="M210 222 L230 92" stroke-dasharray="4 4" stroke-width="1.4"/>
</svg>
