<svg class="diagram" viewBox="0 0 520 250" width="100%" role="img" aria-label="Coach doors 對開式車門示意圖：長軸距行政轎車側面線稿，後門鉸鏈在車尾側、與前門對開，以強調色標出">
<text x="260" y="22" fill="currentColor" font-size="16" text-anchor="middle" opacity=".8">側面（Yangwang Altior／鼎曜這類長軸距座車）</text>
<!-- wheels -->
<circle cx="118" cy="168" r="28" fill="none" stroke="currentColor" stroke-width="2.4"/>
<circle cx="118" cy="168" r="14" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
<circle cx="400" cy="168" r="28" fill="none" stroke="currentColor" stroke-width="2.4"/>
<circle cx="400" cy="168" r="14" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
<!-- body outline: short front overhang, long cabin, long rear overhang -->
<path d="M72,150 L78,118 Q82,104 102,100 L148,96 L170,62 Q176,54 192,52 L330,52 Q348,52 356,64 L378,96 L448,100 Q468,102 474,118 L480,150 Q482,158 472,160 L80,160 Q70,160 72,150 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
<!-- greenhouse / windows -->
<path d="M174,64 L196,64 L214,96 L174,96 Z" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="1.3"/>
<path d="M220,64 L286,64 L286,96 L220,96 Z" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="1.3"/>
<path d="M292,64 L348,64 L372,96 L292,96 Z" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="1.3"/>
<!-- windshield angle -->
<text x="194" y="86" fill="currentColor" font-size="11" text-anchor="middle" opacity=".55">擋風</text>
<!-- front lamp -->
<rect x="74" y="118" width="18" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".7"/>
<!-- grille suggestion -->
<line x1="72" y1="132" x2="88" y2="132" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
<!-- beltline -->
<line x1="148" y1="100" x2="448" y2="100" stroke="currentColor" stroke-width="1.2" opacity=".35"/>
<!-- FRONT door (normal, hinge at front/A-pillar) -->
<path d="M168,64 L168,158" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
<path d="M218,64 L218,158" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
<!-- front hinge mark at A-pillar -->
<circle cx="170" cy="110" r="3.2" fill="currentColor" opacity=".45"/>
<!-- REAR coach door highlighted: hinge at rear -->
<path d="M224,66 L224,156 L348,156 L370,100 L348,66 Z" fill="#f08a5d" fill-opacity=".16" stroke="#f08a5d" stroke-width="2.6" stroke-linejoin="round"/>
<!-- rear hinge at C-pillar -->
<circle cx="346" cy="110" r="4.2" fill="#f08a5d"/>
<!-- open-door suggestion arc at rear hinge -->
<path d="M346,110 Q390,92 410,130" fill="none" stroke="#f08a5d" stroke-width="1.5" stroke-dasharray="4 3"/>
<!-- ground -->
<line x1="40" y1="196" x2="500" y2="196" stroke="currentColor" stroke-width="1.2" opacity=".25"/>
<!-- callouts -->
<line x1="170" y1="110" x2="170" y2="214" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 3" opacity=".45"/>
<text x="120" y="230" fill="currentColor" font-size="15" text-anchor="middle">① 前門鉸鏈在車頭側</text>
<line x1="346" y1="114" x2="346" y2="206" stroke="#f08a5d" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="346" y="222" fill="#f08a5d" font-size="15" text-anchor="middle">② 後門鉸鏈在車尾側</text>
<text x="430" y="178" fill="#f08a5d" font-size="15">③ 對開，開口近 90°</text>
<text x="260" y="246" fill="currentColor" font-size="13" text-anchor="middle" opacity=".75">後門往後開，前後門對開，方便後座上下車（本期 Altior／鼎曜）</text>
</svg>
