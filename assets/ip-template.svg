<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" class="intsvg" role="img" aria-label="儀表板配色示意（程式繪製）">
<defs>
 <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="none"/><path d="M1 3c3-2 5 2 8 0M5 9c2-1 4 1 7-1M0 12c2 1 3-1 5 0" stroke="#000" stroke-opacity=".10" fill="none"/><circle cx="10" cy="5" r=".8" fill="#fff" fill-opacity=".10"/></pattern>
 <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 2h4M4 6h4" stroke="#000" stroke-opacity=".14" stroke-width="2"/><path d="M2 0v4M6 4v4" stroke="#fff" stroke-opacity=".16" stroke-width="2"/></pattern>
 <pattern id="brushed" width="200" height="4" patternUnits="userSpaceOnUse"><path d="M0 1h200" stroke="#fff" stroke-opacity=".28"/><path d="M0 3h120M140 3h60" stroke="#000" stroke-opacity=".12"/></pattern>
 <pattern id="perf" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2" fill="#000" fill-opacity=".45"/></pattern>
 <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
 <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd8de"/><stop offset="1" stop-color="#eef1f2"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2430"/><stop offset="1" stop-color="#0c1016"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".4" r=".8"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
</defs>
<rect width="1200" height="700" fill="url(#sky)"/>
<!-- roof / A-pillars (headliner) -->
<path id="headliner" d="M0 0H1200V70Q600 30 0 90Z" fill="var(--headliner)"/><path d="M0 0H1200V70Q600 30 0 90Z" fill="url(#weave)"/>
<path d="M0 90 L160 70 L330 250 L180 270Z" fill="var(--headliner)"/><path d="M1200 70 L1060 64 L900 240 L1050 250Z" fill="var(--headliner)"/>
<!-- IP upper soft pad -->
<g id="ip-upper"><path d="M0 330 Q120 240 330 236 Q600 215 900 232 Q1100 240 1200 300 V400 H0Z" fill="var(--ip-upper)"/><path d="M0 330 Q120 240 330 236 Q600 215 900 232 Q1100 240 1200 300 V400 H0Z" fill="url(#grain)"/><path d="M0 330 Q120 240 330 236 Q600 215 900 232 Q1100 240 1200 300 V400 H0Z" fill="url(#topLight)"/>
<path d="M0 352 Q300 300 600 300 Q900 300 1200 330" stroke="var(--stitch)" stroke-width="2.4" stroke-dasharray="7 5" fill="none"/></g>
<!-- driver cluster -->
<rect x="250" y="262" width="210" height="62" rx="10" fill="url(#screen)"/><circle cx="300" cy="293" r="20" fill="none" stroke="#5cc2ff" stroke-opacity=".6" stroke-width="3"/><rect x="340" y="282" width="100" height="6" rx="3" fill="#fff" fill-opacity=".35"/><rect x="340" y="296" width="70" height="6" rx="3" fill="#fff" fill-opacity=".2"/>
<!-- decor strip -->
<g id="ip-decor"><path d="M0 400 Q600 372 1200 400 V428 Q600 400 0 428Z" fill="var(--ip-decor)"/><path d="M0 400 Q600 372 1200 400 V428 Q600 400 0 428Z" fill="url(#brushed)"/><path d="M0 400 Q600 372 1200 400" stroke="#fff" stroke-opacity=".5" fill="none"/></g>
<!-- vents -->
<g fill="var(--door-lower)"><rect x="80" y="404" width="120" height="20" rx="6"/><rect x="980" y="404" width="130" height="20" rx="6"/></g>
<g stroke="#000" stroke-opacity=".5"><path d="M86 410h108M86 416h108M86 422h108M986 410h118M986 416h118M986 422h118"/></g>
<!-- IP lower -->
<g id="ip-lower"><path d="M0 428 Q600 400 1200 428 V560 H0Z" fill="var(--ip-lower)"/><path d="M0 428 Q600 400 1200 428 V560 H0Z" fill="url(#grain)"/><path d="M0 428 Q600 400 1200 428 V560 H0Z" fill="url(#topLight)"/></g>
<!-- center display -->
<g><rect x="520" y="300" width="250" height="150" rx="12" fill="#111" /><rect x="528" y="308" width="234" height="134" rx="8" fill="url(#screen)"/><rect x="545" y="325" width="120" height="70" rx="6" fill="#2a6f8f" fill-opacity=".55"/><rect x="675" y="325" width="70" height="30" rx="5" fill="#fff" fill-opacity=".15"/><rect x="675" y="362" width="70" height="30" rx="5" fill="#fff" fill-opacity=".1"/><rect x="545" y="405" width="200" height="18" rx="5" fill="#fff" fill-opacity=".08"/><path d="M528 308h234" stroke="#fff" stroke-opacity=".25"/></g>
<!-- steering wheel -->
<g id="steering"><ellipse cx="330" cy="430" rx="150" ry="120" fill="none" stroke="var(--steering)" stroke-width="30"/><ellipse cx="330" cy="430" rx="150" ry="120" fill="none" stroke="url(#grain)" stroke-width="30"/><ellipse cx="330" cy="420" rx="150" ry="120" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="6"/>
<path d="M190 450 Q330 420 470 450 L430 500 Q330 470 230 500Z" fill="var(--steering)"/><rect x="300" y="440" width="60" height="38" rx="10" fill="var(--ip-decor)"/><rect x="300" y="440" width="60" height="38" rx="10" fill="url(#brushed)"/>
<ellipse cx="330" cy="430" rx="150" ry="120" fill="none" stroke="var(--stitch)" stroke-width="1.6" stroke-dasharray="5 5"/></g>
<!-- center console -->
<g id="console"><path d="M520 700 L560 470 H740 L790 700Z" fill="var(--console)"/><path d="M520 700 L560 470 H740 L790 700Z" fill="url(#sideShade)"/><path d="M560 470 H740 L748 500 H552Z" fill="var(--ip-decor)"/><path d="M560 470 H740 L748 500 H552Z" fill="url(#brushed)"/>
<ellipse cx="610" cy="540" rx="26" ry="12" fill="#000" fill-opacity=".45"/><ellipse cx="690" cy="540" rx="26" ry="12" fill="#000" fill-opacity=".45"/>
<path d="M545 600 H775 L790 700 H520Z" fill="var(--armrest)"/><path d="M545 600 H775 L790 700 H520Z" fill="url(#grain)"/><path d="M552 612 H768" stroke="var(--stitch)" stroke-width="2" stroke-dasharray="6 4"/></g>
<!-- front seat backs -->
<g id="seat"><path d="M820 700 Q830 560 930 540 Q1060 530 1110 600 L1130 700Z" fill="var(--seat)"/><path d="M820 700 Q830 560 930 540 Q1060 530 1110 600 L1130 700Z" fill="url(#weave)"/><path d="M820 700 Q830 560 930 540 Q1060 530 1110 600 L1130 700Z" fill="url(#topLight)"/><path d="M880 700 Q890 600 970 585 Q1040 580 1070 640 L1080 700" stroke="var(--stitch)" stroke-width="2" stroke-dasharray="6 4" fill="none"/></g>

<rect width="1200" height="700" fill="url(#vig)"/>
</svg>
